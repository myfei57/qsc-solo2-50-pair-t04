platform:
  name: RubberCure
  project_id: zxy-73-py
  storage_root: var/state

limits:
  mold:
    max_cavities: 8
    sensor_map_max_age_s: 172800.0
  press:
    fleet_size: 3
    default_thickness_mm: 6.0
    default_product_code: RB-215
  steam:
    target_pressure_kpa: 640.0
    min_pressure_kpa: 80.0
    max_pressure_kpa: 760.0
    safe_residual_kpa: 12.0
    purge_hold_s: 20.0
    purge_token_max_age_s: 180.0
    vent_hold_s: 8.0
    valve_rated_flow_kg_h: 960.0
    trap_rated_flow_kg_h: 240.0
  temp:
    setpoint_c: 151.0
    tolerance_c: 2.0
    warmup_rate_c_per_min: 6.0
    confirm_hold_s: 60.0
    max_cavity_spread_c: 3.0
  timer:
    default_nominal_s: 600.0
    shortfall_ratio: 0.05
    overrun_ratio: 0.08
  cool:
    rated_flow_m3_h: 18.0
    min_flow_m3_h: 6.0
    alarm_inlet_c: 32.0
    alarm_outlet_c: 48.0
    drain_hold_s: 30.0
  batch:
    dispatch_window_s: 180.0
    max_queue: 12

# 按制品型号给出的分段升温（升压）配方：每段到点后在容差带内停够 hold_s
# 才进下一段；中途冲过 target + tolerance 自动退回本段下沿，重新到点、重新
# 计时。最后一段到点后交由硫化计时保温，hold_s 置 0。
ramps:
  RB-215:
    stages:
      - target_pressure_kpa: 320.0
        hold_s: 60.0
        tolerance_kpa: 24.0
      - target_pressure_kpa: 480.0
        hold_s: 90.0
        tolerance_kpa: 24.0
      - target_pressure_kpa: 640.0
        hold_s: 0.0
        tolerance_kpa: 24.0
  RB-330:
    stages:
      - target_pressure_kpa: 280.0
        hold_s: 90.0
        tolerance_kpa: 24.0
      - target_pressure_kpa: 420.0
        hold_s: 120.0
        tolerance_kpa: 24.0
      - target_pressure_kpa: 560.0
        hold_s: 120.0
        tolerance_kpa: 24.0
      - target_pressure_kpa: 680.0
        hold_s: 0.0
        tolerance_kpa: 24.0

pages:
  - press
  - steam
  - timer
  - alarms
